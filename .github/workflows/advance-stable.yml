name: Advance stable branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Run one at a time. Parallel runs could finish out of order, and then the push
# of the older commit fails as non-fast-forward. A run still waiting to start is
# replaced when a newer commit arrives.
concurrency:
  group: advance-stable
  cancel-in-progress: false

jobs:
  advance:
    # workflow_dispatch can pick any branch, but only main may reach stable
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - id: setup-acton
        uses: actonlang/setup-acton@v1
        with:
          channel: 'stable'
      - name: "Check out main"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: make build
      - run: make test
      - name: "Fast-forward stable to main"
        run: |
          git push origin HEAD:refs/heads/stable
