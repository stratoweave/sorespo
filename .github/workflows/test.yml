name: Diagnose quicklab segmentation fault
on:
  push:
    branches: [investigate-sorespo-ci-segfault]
permissions:
  contents: read
  actions: read
jobs:
  reproduce:
    uses: ./.github/workflows/net-test.yml
    with:
      testenv: quicklab
      arch: linux-x86_64
      run: true
    secrets: inherit
